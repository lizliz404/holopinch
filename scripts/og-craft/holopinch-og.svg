<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="stage" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#151c1e"/>
      <stop offset="50%" stop-color="#0c1012"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="36%" r="32%">
      <stop offset="0%" stop-color="#7dd3c0" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#5eead4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070809" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070809" stop-opacity="0"/>
      <stop offset="58%" stop-color="#070809" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="crystalFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8fffa" stop-opacity="0.62"/>
      <stop offset="40%" stop-color="#7dd3c0" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#2a9f8f" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="crystalSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8f0e0" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#1a6b62" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="crystalTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f0fffb" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#stage)"/>
  <g opacity="0.028" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>
  <ellipse cx="600" cy="230" rx="360" ry="200" fill="url(#bloom)"/>

  <!-- LEFT hand: MediaPipe-style landmark skeleton (wrist + 5 fingers), pinch toward crystal -->
  <g id="leftHand" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- bones -->
    <g stroke="#7dd3c0" stroke-opacity="0.55" stroke-width="2.2">
      <!-- wrist to palm -->
      <path d="M175 390 L230 300"/>
      <!-- palm base fan -->
      <path d="M230 300 L255 245"/>
      <path d="M230 300 L275 255"/>
      <path d="M230 300 L300 270"/>
      <path d="M230 300 L310 295"/>
      <path d="M230 300 L290 330"/>
      <!-- pinky chain (folded) -->
      <path d="M255 245 L268 210 L275 185"/>
      <!-- ring folded -->
      <path d="M275 255 L295 215 L305 185"/>
      <!-- middle folded -->
      <path d="M300 270 L325 230 L338 198"/>
      <!-- index extended to pinch -->
      <path d="M310 295 L360 250 L405 215 L445 195"/>
      <!-- thumb opposing -->
      <path d="M290 330 L340 320 L390 300 L435 275"/>
    </g>
    <!-- landmarks -->
    <g filter="url(#nodeGlow)">
      <circle cx="175" cy="390" r="4.5" fill="#5eead4" opacity="0.7"/>
      <circle cx="230" cy="300" r="5.5" fill="#d8fff5"/>
      <circle cx="255" cy="245" r="3.5" fill="#7dd3c0" opacity="0.85"/>
      <circle cx="275" cy="185" r="3.2" fill="#7dd3c0" opacity="0.7"/>
      <circle cx="305" cy="185" r="3.2" fill="#7dd3c0" opacity="0.7"/>
      <circle cx="338" cy="198" r="3.4" fill="#7dd3c0" opacity="0.75"/>
      <!-- pinch tips (bright) -->
      <circle cx="445" cy="195" r="6.5" fill="#d8fff5"/>
      <circle cx="435" cy="275" r="5.5" fill="#a8f0e0"/>
      <circle cx="405" cy="215" r="3.5" fill="#7dd3c0" opacity="0.8"/>
      <circle cx="360" cy="250" r="3.2" fill="#7dd3c0" opacity="0.65"/>
    </g>
  </g>

  <!-- RIGHT hand mirror -->
  <g id="rightHand" transform="translate(1200,0) scale(-1,1)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#7dd3c0" stroke-opacity="0.55" stroke-width="2.2">
      <path d="M175 390 L230 300"/>
      <path d="M230 300 L255 245"/>
      <path d="M230 300 L275 255"/>
      <path d="M230 300 L300 270"/>
      <path d="M230 300 L310 295"/>
      <path d="M230 300 L290 330"/>
      <path d="M255 245 L268 210 L275 185"/>
      <path d="M275 255 L295 215 L305 185"/>
      <path d="M300 270 L325 230 L338 198"/>
      <path d="M310 295 L360 250 L405 215 L445 195"/>
      <path d="M290 330 L340 320 L390 300 L435 275"/>
    </g>
    <g filter="url(#nodeGlow)">
      <circle cx="175" cy="390" r="4.5" fill="#5eead4" opacity="0.7"/>
      <circle cx="230" cy="300" r="5.5" fill="#d8fff5"/>
      <circle cx="255" cy="245" r="3.5" fill="#7dd3c0" opacity="0.85"/>
      <circle cx="275" cy="185" r="3.2" fill="#7dd3c0" opacity="0.7"/>
      <circle cx="305" cy="185" r="3.2" fill="#7dd3c0" opacity="0.7"/>
      <circle cx="338" cy="198" r="3.4" fill="#7dd3c0" opacity="0.75"/>
      <circle cx="445" cy="195" r="6.5" fill="#d8fff5"/>
      <circle cx="435" cy="275" r="5.5" fill="#a8f0e0"/>
      <circle cx="405" cy="215" r="3.5" fill="#7dd3c0" opacity="0.8"/>
      <circle cx="360" cy="250" r="3.2" fill="#7dd3c0" opacity="0.65"/>
    </g>
  </g>

  <!-- HOLOGRAM crystal-bar between pinch tips -->
  <g filter="url(#glow)">
    <ellipse cx="600" cy="235" rx="205" ry="58" fill="#7dd3c0" opacity="0.18"/>
    <ellipse cx="600" cy="235" rx="118" ry="32" fill="#d8fff5" opacity="0.14"/>

    <polygon points="455,180 745,170 775,212 485,225" fill="url(#crystalTop)"/>
    <polygon points="485,225 775,212 755,292 470,304" fill="url(#crystalFace)"/>
    <polygon points="470,304 755,292 735,322 488,332" fill="url(#crystalSide)" opacity="0.88"/>

    <g fill="none" stroke="#ffffff" stroke-linejoin="round">
      <polygon points="455,180 745,170 775,212 485,225" stroke-opacity="0.96" stroke-width="1.9"/>
      <polygon points="485,225 775,212 755,292 470,304" stroke-opacity="0.92" stroke-width="1.9"/>
      <polygon points="470,304 755,292 735,322 488,332" stroke-opacity="0.55" stroke-width="1.4"/>
      <line x1="510" y1="185" x2="525" y2="312" stroke-opacity="0.50" stroke-width="1.2"/>
      <line x1="555" y1="181" x2="570" y2="310" stroke-opacity="0.68" stroke-width="1.25"/>
      <line x1="600" y1="178" x2="615" y2="308" stroke-opacity="0.90" stroke-width="1.4"/>
      <line x1="645" y1="176" x2="660" y2="306" stroke-opacity="0.68" stroke-width="1.25"/>
      <line x1="690" y1="174" x2="705" y2="302" stroke-opacity="0.50" stroke-width="1.2"/>
      <line x1="725" y1="172" x2="740" y2="298" stroke-opacity="0.38" stroke-width="1.1"/>
      <polyline points="468,205 760,193" stroke-opacity="0.42" stroke-width="1"/>
      <polyline points="478,258 762,246" stroke-opacity="0.52" stroke-width="1.15"/>
      <polyline points="474,282 758,270" stroke-opacity="0.36" stroke-width="1"/>
    </g>

    <circle cx="455" cy="180" r="5" fill="#d8fff5" opacity="0.98"/>
    <circle cx="600" cy="178" r="3.2" fill="#7dd3c0" opacity="0.92"/>
    <circle cx="755" cy="292" r="4" fill="#7dd3c0" opacity="0.78"/>
  </g>

  <!-- energy filaments from pinch tips into crystal -->
  <g stroke="#7dd3c0" stroke-width="1.4" fill="none" opacity="0.45">
    <path d="M445 195 C470 200 485 205 500 210"/>
    <path d="M435 275 C460 270 475 265 490 260"/>
    <path d="M755 195 C730 200 715 205 700 210" transform="translate(0,0)"/>
  </g>
  <!-- right-side filaments (manual, not mirrored transform) -->
  <g stroke="#7dd3c0" stroke-width="1.4" fill="none" opacity="0.45">
    <path d="M755 195 C730 200 715 205 700 210"/>
    <path d="M765 275 C740 270 725 265 710 260"/>
  </g>

  <g fill="#7dd3c0" opacity="0.45">
    <circle cx="520" cy="155" r="1.8"/>
    <circle cx="680" cy="148" r="1.5"/>
    <circle cx="560" cy="340" r="1.6"/>
    <circle cx="640" cy="345" r="1.3"/>
  </g>

  <rect width="1200" height="630" fill="url(#scrim)"/>

  <g transform="translate(600, 478)">
    <g transform="translate(0,-58)">
      <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="none" stroke="#7dd3c0" stroke-width="2.2"/>
      <rect x="-4.5" y="-4.5" width="9" height="9" transform="rotate(45)" fill="#d8fff5" opacity="0.92"/>
    </g>
    <text text-anchor="middle" x="0" y="8"
      font-family="Inter, Liberation Sans, DejaVu Sans, sans-serif"
      font-size="58" font-weight="700" letter-spacing="-0.03em" fill="#e8e6e3">HoloPinch</text>
    <text text-anchor="middle" x="0" y="52"
      font-family="Inter, Liberation Sans, DejaVu Sans, sans-serif"
      font-size="26" font-weight="500" fill="#b8d9d0">Hold a hologram between your hands</text>
  </g>
</svg>
